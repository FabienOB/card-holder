name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Le token n'a besoin que de publier des Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Les tests d'abord : un échec doit empêcher la mise en ligne.
      # Ils couvrent notamment la migration de schéma Dexie, dont une
      # régression ferait disparaître des cartes sur les téléphones.
      - run: npm test

      # Le build inclut le typecheck TypeScript (tsc -b && vite build) :
      # une erreur de types casse le déploiement, ce qui est voulu.
      - run: npm run build

      # `enablement: true` bascule la source Pages sur « GitHub Actions » via
      # l'API si ce n'est pas déjà fait. Sans cela, l'étape échoue tant que le
      # dépôt est configuré en « Deploy from a branch ».
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
